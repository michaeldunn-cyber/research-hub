<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infillion Research Hub</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0a0a0f; --text:#e8e8f0; --text3:#5a5a72; --accent:#c8f060; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .wrap { text-align:center; }
  .logo { font-family:'DM Serif Display',serif; font-size:28px; margin-bottom:12px; }
  .logo span { color:var(--accent); }
  p { font-family:'DM Mono',monospace; font-size:12px; color:var(--text3); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">Infillion <span>Research Hub</span></div>
    <p>first digest generates next monday at 8am et</p>
  </div>
</body>
</html>
